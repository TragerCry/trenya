<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>IRON MASSACRE | Месячный дневник</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e8e8e8;
            padding: 16px 12px;
            font-size: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            border-bottom: 3px solid #e05a3a;
            margin-bottom: 20px;
            padding-bottom: 12px;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 20%, #e05a3a 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* АГРЕССИВНАЯ ШКАЛА МЕСЯЧНОГО ПРОГРЕССА */
        .month-progress {
            background: #121212;
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 24px;
            border: 1px solid #e05a3a;
            box-shadow: 0 0 10px rgba(224, 90, 58, 0.2);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .progress-label {
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e05a3a;
            text-shadow: 0 0 4px #e05a3a;
        }

        .progress-value {
            font-size: 1.4rem;
            font-weight: 900;
            font-family: monospace;
            color: #ffaa00;
            text-shadow: 0 0 6px #ff6600;
        }

        .fire-bar-container {
            position: relative;
            background: #1a1a1a;
            border-radius: 40px;
            height: 28px;
            overflow: visible;
            margin-top: 8px;
            border: 1px solid #3a3a3a;
        }

        .fire-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4500, #ff7700, #ffbb00);
            border-radius: 40px;
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 0 12px #ff5500;
            position: relative;
        }

        /* Искра/огонь на конце полоски */
        .fire-spark {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ffcc00, #ff3300);
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.9;
            transition: all 0.2s;
            pointer-events: none;
            box-shadow: 0 0 12px #ff9900;
        }

        /* Анимация огня при 100% */
        .fire-bar-fill.complete {
            background: linear-gradient(90deg, #ff2200, #ff4400, #ff8800);
            box-shadow: 0 0 20px #ff3300, inset 0 0 8px rgba(255,255,200,0.6);
            animation: intenseGlow 0.6s ease-in-out infinite alternate;
        }

        .fire-bar-fill.complete .fire-spark {
            width: 28px;
            height: 28px;
            background: radial-gradient(circle, #ffffaa, #ff5500);
            filter: blur(4px);
            animation: sparkPulse 0.5s ease-in-out infinite alternate;
            box-shadow: 0 0 20px #ffaa00;
        }

        @keyframes intenseGlow {
            0% { box-shadow: 0 0 8px #ff3300, inset 0 0 4px #ffaa00; }
            100% { box-shadow: 0 0 28px #ff0000, inset 0 0 16px #ffdd88; }
        }

        @keyframes sparkPulse {
            0% { transform: translateY(-50%) scale(0.9); opacity: 0.8; filter: blur(3px); }
            100% { transform: translateY(-50%) scale(1.3); opacity: 1; filter: blur(5px); }
        }

        /* ВСЕ ОСТАЛЬНЫЕ СТИЛИ (без недельной шкалы) */
        .week-block {
            background: #121212;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #252525;
            overflow: hidden;
        }

        .week-header {
            background: #1c1c1c;
            padding: 16px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #e05a3a;
        }

        .week-header:active {
            background: #262626;
        }

        .week-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #f0f0f0;
        }

        .week-stats {
            font-size: 0.7rem;
            color: #e05a3a;
            margin-top: 4px;
        }

        .week-toggle {
            font-size: 1.4rem;
            color: #e05a3a;
        }

        .week-content {
            display: block;
            padding: 8px 0;
        }

        .week-content.collapsed {
            display: none;
        }

        .day-card {
            background: #0f0f0f;
            border-radius: 16px;
            margin: 12px 14px;
            border: 1px solid #252525;
            overflow: hidden;
        }

        .day-header {
            background: #1a1a1a;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #e05a3a;
        }

        .day-info {
            flex: 1;
        }

        .day-name {
            font-weight: 800;
            font-size: 1rem;
            color: #f0f0f0;
        }

        .day-focus {
            font-size: 0.6rem;
            color: #e05a3a;
            margin-top: 2px;
        }

        .day-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .check-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #252525;
            border: 2px solid #4a4a4a;
            cursor: pointer;
            transition: 0.1s;
        }

        .check-circle.checked {
            background: #2ea043;
            border-color: #2ea043;
            box-shadow: 0 0 6px #2ea043;
        }

        .check-circle:active {
            transform: scale(0.92);
        }

        .day-toggle {
            font-size: 1.2rem;
            color: #e05a3a;
            cursor: pointer;
            width: 32px;
            text-align: center;
        }

        .day-content {
            display: block;
            padding: 8px 12px 16px;
        }

        .day-content.collapsed {
            display: none;
        }

        .exercise-card {
            background: #0a0a0a;
            margin: 12px 0;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid #252525;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
            gap: 8px;
        }

        .exercise-name {
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .clickable-name {
            background: #e05a3a20;
            color: #e05a3a;
            border-radius: 20px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            border: 0.5px solid #e05a3a60;
        }

        .reset-alt-btn {
            background: #1e1e1e;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 10px;
            border-radius: 30px;
        }

        .target-info {
            font-family: monospace;
            font-size: 0.7rem;
            color: #e05a3a;
            background: #121212;
            padding: 5px 10px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #aaa;
            font-weight: 600;
        }

        .input-field {
            background: #060606;
            border: 1px solid #2c2c2c;
            padding: 10px 12px;
            color: #f2f2f2;
            font-size: 0.9rem;
            border-radius: 12px;
            width: 100%;
            font-family: monospace;
        }

        .comment-input {
            background: #060606;
            border: 1px solid #2c2c2c;
            padding: 10px 12px;
            color: #cfcfcf;
            width: 100%;
            font-size: 0.8rem;
            border-radius: 12px;
            margin-top: 4px;
        }

        .footer-note {
            margin-top: 30px;
            background: #0c0c0c;
            border-top: 2px solid #e05a3a;
            padding: 14px;
            text-align: center;
            font-size: 0.7rem;
            color: #aaa;
            border-radius: 40px;
        }

        .journal-card {
            background: #0f0f0f;
            margin: 12px 14px;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid #252525;
        }

        .reset-buttons {
            display: flex;
            gap: 12px;
            margin: 20px 14px;
            flex-wrap: wrap;
        }

        .reset-btn {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #e05a3a;
            padding: 14px;
            border-radius: 40px;
            color: #e05a3a;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            transition: 0.1s;
        }

        .reset-btn:active {
            background: #e05a3a;
            color: #0a0a0a;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #181818;
            border-left: 5px solid #e05a3a;
            max-width: 380px;
            width: 100%;
            padding: 24px;
            border-radius: 28px;
        }

        .modal-content h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #e05a3a;
        }

        .alt-btn {
            display: block;
            width: 100%;
            background: #252525;
            border: 1px solid #e05a3a;
            padding: 14px;
            margin: 12px 0;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 40px;
            cursor: pointer;
            text-align: center;
        }

        .close-modal {
            background: #2a2a2a;
            border: none;
            padding: 12px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            border-radius: 40px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚡ IRON MASSACRE</h1>
    </div>

    <!-- АГРЕССИВНАЯ ШКАЛА МЕСЯЧНОГО ПРОГРЕССА -->
    <div class="month-progress">
        <div class="progress-header">
            <span class="progress-label">🔥 МЕСЯЧНЫЙ ПРОГРЕСС 🔥</span>
            <span class="progress-value" id="monthProgressText">0/15</span>
        </div>
        <div class="fire-bar-container">
            <div class="fire-bar-fill" id="monthProgressFill">
                <div class="fire-spark"></div>
            </div>
        </div>
    </div>

    <div id="app"></div>

    <div class="reset-buttons">
        <div class="reset-btn" id="resetCheckboxesBtn">❌ СБРОСИТЬ ВСЕ ОТМЕТКИ</div>
        <div class="reset-btn" id="resetAllDataBtn">⚠️ ОЧИСТИТЬ ВСЕ ДАННЫЕ</div>
    </div>

    <div class="footer-note">
        💀 КЛИК ПО НАЗВАНИЮ → АЛЬТЕРНАТИВЫ | КЛИК ПО ШАПКЕ → СВЕРНУТЬ 💀
    </div>
</div>

<div id="altModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>
        <div id="modalButtons"></div>
        <button class="close-modal" onclick="closeModal()">ОТМЕНА</button>
    </div>
</div>

<script>
    const dayTemplates = {
        monday: { name: "ПН — ТЯЖЁЛЫЙ НИЗ + КОР", focus: "ПРИСЕД | РУМЫНКА | ПРЕСС",
            exercises: [
                { id: "squat", name: "🏋️ ПРИСЕДАНИЯ СО ШТАНГОЙ", target: "85кг x5 / 90кг x3 / 85кг x4", weightId: "squat", repsId: "squat_reps", commId: "squat_comm" },
                { id: "rdl", name: "🦵 РУМЫНСКАЯ ТЯГА", target: "70кг x 8-10 / 3 подхода", weightId: "rdl", repsId: "rdl_reps", commId: "rdl_comm" },
                { id: "lunges", name: "🏃 РАЗГИБАНИЕ НОГ", target: "16-18кг x 10 (каждая нога)", weightId: "lunges", repsId: "lunges_reps", commId: "lunges_comm" },
                { id: "calves", name: "🐮 ПОДЪЁМЫ НА НОСКИ", target: "100кг x 15-20 / 4 подхода", weightId: "calves", repsId: "calves_reps", commId: "calves_comm" },
                { id: "crunch", name: "💥 СКРУЧИВАНИЯ (пресс)", target: "вес тела / 20-25 / 3-4 подхода", weightId: "crunch", repsId: "crunch_reps", commId: "crunch_comm" }
            ] },
        wednesday: { name: "СР — ЖИМ + ТРИЦЕПС", focus: "ПРОБИВАЕМ ПЛАТО",
            exercises: [
                { id: "bench", name: "🏆 ЖИМ ЛЕЖА", target: "70x6 / 70x5 / 65x8", weightId: "bench", repsId: "bench_reps", commId: "bench_comm" },
                { id: "incline", name: "📐 ЖИМ ГАНТЕЛЕЙ НАКЛОН", target: "20кг x 10-12 / 3 подхода", weightId: "incline", repsId: "incline_reps", commId: "incline_comm" },
                { id: "shoulders", name: "⚡ МАХИ + ЖИМ СИДЯ", target: "9кг + 14кг / 3 сета", weightId: "shoulders", repsId: "shoulders_reps", commId: "shoulders_comm" },
                { id: "dips", name: "🥇 БРУСЬЯ С ВЕСОМ", target: "+5кг x 10-12 / 3 подхода", weightId: "dips", repsId: "dips_reps", commId: "dips_comm" },
                { id: "french", name: "🔨 ФРАНЦУЗСКИЙ ЖИМ", target: "25-30кг x 10-12", weightId: "french", repsId: "french_reps", commId: "french_comm" },
                { id: "pushdown", name: "⛓️ РАЗГИБАНИЯ В БЛОКЕ", target: "20-25кг x 12-15", weightId: "pushdown", repsId: "pushdown_reps", commId: "pushdown_comm" }
            ] },
        friday: { name: "ПТ — СПИНА / БИЦЕПС", focus: "ШИРИНА + ТОЛЩИНА",
            exercises: [
                { id: "pullup", name: "🦍 ПОДТЯГИВАНИЯ С ВЕСОМ", target: "+7.5кг x 8 / 3 подхода", weightId: "pullup", repsId: "pullup_reps", commId: "pullup_comm" },
                { id: "bentrow", name: "🎯 ТЯГА ШТАНГИ В НАКЛОНЕ", target: "50кг x 10-12 / 3 подхода", weightId: "bentrow", repsId: "bentrow_reps", commId: "bentrow_comm" },
                { id: "lowrow", name: "🔽 ТЯГА НИЖНЕГО БЛОКА", target: "55-60кг x 12-15", weightId: "lowrow", repsId: "lowrow_reps", commId: "lowrow_comm" },
                { id: "shrugs", name: "⛰️ ШРАГИ", target: "45-55кг x 12-15", weightId: "shrugs", repsId: "shrugs_reps", commId: "shrugs_comm" },
                { id: "bicep", name: "💪 СГИБАНИЯ НА БИЦЕПС", target: "17кг x 8-10 / 3 подхода", weightId: "bicep", repsId: "bicep_reps", commId: "bicep_comm" },
                { id: "hammer", name: "🔨 МОЛОТКИ", target: "14-16кг x 10-12", weightId: "hammer", repsId: "hammer_reps", commId: "hammer_comm" }
            ] }
    };

    const alternatives = {};
    const altList = [
        ["squat","🏋️ ПРИСЕДАНИЯ СО ШТАНГОЙ","🏋️ Жим ногами","🏋️ Гоблет-присед"],
        ["rdl","🦵 РУМЫНСКАЯ ТЯГА","🦵 Гиперэкстензия","🦵 Сгибания ног лёжа"],
        ["lunges","🏃 РАЗГИБАНИЕ НОГ","🏃 Болгарские сплит-приседы","🏃 Зашагивания"],
        ["calves","🐮 ПОДЪЁМЫ НА НОСКИ","🐮 На носки сидя","🐮 Осёл со штангой"],
        ["crunch","💥 СКРУЧИВАНИЯ","💥 Подъёмы ног в висе","💥 Планка с весом"],
        ["bench","🏆 ЖИМ ЛЕЖА","🏆 Жим гантелей","🏆 Жим в Смите"],
        ["incline","📐 ЖИМ ГАНТЕЛЕЙ НАКЛОН","📐 Жим на верхнем блоке","📐 Жим лежа негатив"],
        ["shoulders","⚡ МАХИ + ЖИМ","⚡ Тяга к подбородку","⚡ Махи в кроссовере"],
        ["dips","🥇 БРУСЬЯ С ВЕСОМ","🥇 Жим узким хватом","🥇 Разгибания из-за головы"],
        ["french","🔨 ФРАНЦУЗСКИЙ ЖИМ","🔨 Разгибания с гантелью","🔨 Кикбэк"],
        ["pushdown","⛓️ РАЗГИБАНИЯ В БЛОКЕ","⛓️ Обратным хватом","⛓️ Одной рукой"],
        ["pullup","🦍 ПОДТЯГИВАНИЯ","🦍 Тяга верха широко","🦍 Тяга гравитрона"],
        ["bentrow","🎯 ТЯГА ШТАНГИ","🎯 Тяга Т-грифа","🎯 Тяга гантели"],
        ["lowrow","🔽 ТЯГА НИЖНЕГО БЛОКА","🔽 Тяга в Hammer","🔽 Тяга эспандера"],
        ["shrugs","⛰️ ШРАГИ","⛰️ Шраги с гантелями","⛰️ В тренажёре"],
        ["bicep","💪 СГИБАНИЯ НА БИЦЕПС","💪 Со штангой","💪 Проповеднические"],
        ["hammer","🔨 МОЛОТКИ","🔨 С канатом","🔨 Реверсивные"]
    ];
    altList.forEach(a => { alternatives[a[0]] = { name: a[1], alt1: a[2], alt2: a[3] }; });

    let currentExId = null, currentCard = null, currentWeek = null, currentDay = null;
    function openModal(exId, cardElement, weekIdx, dayKey) {
        currentExId = exId; currentCard = cardElement; currentWeek = weekIdx; currentDay = dayKey;
        const alt = alternatives[exId];
        if (!alt) return;
        document.getElementById("modalTitle").innerText = alt.name;
        const btnsDiv = document.getElementById("modalButtons");
        btnsDiv.innerHTML = "";
        [alt.alt1, alt.alt2].forEach(a => {
            const btn = document.createElement("button");
            btn.className = "alt-btn";
            btn.innerText = a;
            btn.onclick = () => {
                if(currentCard) {
                    const span = currentCard.querySelector(".clickable-name");
                    if(span) span.innerText = a;
                    localStorage.setItem(`alt_${currentWeek}_${currentDay}_${currentExId}`, a);
                }
                closeModal();
            };
            btnsDiv.appendChild(btn);
        });
        document.getElementById("altModal").style.display = "flex";
    }
    function resetToOriginal(exId, card, weekIdx, dayKey) {
        const alt = alternatives[exId];
        if(alt?.name) {
            const span = card.querySelector(".clickable-name");
            if(span) span.innerText = alt.name;
            localStorage.removeItem(`alt_${weekIdx}_${dayKey}_${exId}`);
        }
    }
    function closeModal() { document.getElementById("altModal").style.display = "none"; }

    let checkedBoxes = new Set();

    function loadCheckboxes() {
        const saved = localStorage.getItem("workoutCheckboxes");
        if(saved) checkedBoxes = new Set(JSON.parse(saved));
        updateMonthProgress();
    }

    function toggleCheckbox(weekNum, dayKey) {
        const key = `${weekNum}_${dayKey}`;
        if(checkedBoxes.has(key)) checkedBoxes.delete(key);
        else checkedBoxes.add(key);
        localStorage.setItem("workoutCheckboxes", JSON.stringify([...checkedBoxes]));
        updateMonthProgress();
        renderAllCheckCircles();
        renderWeekStats();
    }

    function isCheckboxChecked(weekNum, dayKey) {
        return checkedBoxes.has(`${weekNum}_${dayKey}`);
    }

    function getWeekTrainingCount(weekNum) {
        let cnt = 0;
        if(isCheckboxChecked(weekNum, "monday")) cnt++;
        if(isCheckboxChecked(weekNum, "wednesday")) cnt++;
        if(isCheckboxChecked(weekNum, "friday")) cnt++;
        return cnt;
    }

    function getTotalTrainingCount() {
        let total = 0;
        for(let w=0; w<5; w++) total += getWeekTrainingCount(w);
        return total;
    }

    function updateMonthProgress() {
        const total = getTotalTrainingCount();
        const percent = (total / 15) * 100;
        const fillBar = document.getElementById("monthProgressFill");
        fillBar.style.width = `${percent}%`;
        document.getElementById("monthProgressText").innerHTML = `${total}/15`;
        
        if(total === 15) {
            fillBar.classList.add("complete");
        } else {
            fillBar.classList.remove("complete");
        }
    }

    function renderWeekStats() {
        for(let i=0; i<5; i++) {
            const statSpan = document.getElementById(`weekStats_${i}`);
            if(statSpan) statSpan.innerText = `${getWeekTrainingCount(i)}/3`;
        }
        updateMonthProgress();
    }

    function renderAllCheckCircles() {
        document.querySelectorAll('.check-circle').forEach(circle => {
            const week = parseInt(circle.dataset.week);
            const day = circle.dataset.day;
            if(isCheckboxChecked(week, day)) circle.classList.add('checked');
            else circle.classList.remove('checked');
        });
    }

    function saveAllData() {
        const inputs = document.querySelectorAll('input, textarea');
        const data = {};
        inputs.forEach(inp => { if(inp.id) data[inp.id] = inp.value; });
        localStorage.setItem('ironTrainingLog', JSON.stringify(data));
    }

    function loadAllData() {
        const saved = localStorage.getItem('ironTrainingLog');
        if(saved) try { const data = JSON.parse(saved); for(const [id,val] of Object.entries(data)) { const el=document.getElementById(id); if(el) el.value=val; } } catch(e) {}
    }

    function resetAllCheckboxes() {
        checkedBoxes.clear();
        localStorage.setItem("workoutCheckboxes", JSON.stringify([]));
        updateMonthProgress();
        renderWeekStats();
        renderAllCheckCircles();
    }

    function resetAllFormData() {
        if(confirm("⚠️ Ты уверен? Это очистит ВСЕ данные: вес, повторения, комментарии, альтернативы и отметки тренировок. Отменить будет нельзя.")) {
            localStorage.clear();
            location.reload();
        }
    }

    function render() {
        const app = document.getElementById("app");
        app.innerHTML = "";
        for(let weekNum=0; weekNum<5; weekNum++) {
            const weekBlock = document.createElement("div");
            weekBlock.className = "week-block";
            
            const weekHeader = document.createElement("div");
            weekHeader.className = "week-header";
            weekHeader.innerHTML = `
                <div>
                    <div class="week-title">🗓️ ${weekNum+1}-я НЕДЕЛЯ</div>
                    <div class="week-stats" id="weekStats_${weekNum}">0/3</div>
                </div>
                <div class="week-toggle">▼</div>
            `;
            
            const weekContent = document.createElement("div");
            weekContent.className = "week-content";
            
            const days = ["monday", "wednesday", "friday"];
            days.forEach(dayKey => {
                const dayTemplate = dayTemplates[dayKey];
                const dayCard = document.createElement("div");
                dayCard.className = "day-card";
                
                const dayHeader = document.createElement("div");
                dayHeader.className = "day-header";
                
                const isChecked = isCheckboxChecked(weekNum, dayKey);
                
                dayHeader.innerHTML = `
                    <div class="day-info">
                        <div class="day-name">${dayTemplate.name}</div>
                        <div class="day-focus">${dayTemplate.focus}</div>
                    </div>
                    <div class="day-controls">
                        <div class="check-circle ${isChecked ? 'checked' : ''}" data-week="${weekNum}" data-day="${dayKey}"></div>
                        <div class="day-toggle">▼</div>
                    </div>
                `;
                
                const dayContent = document.createElement("div");
                dayContent.className = "day-content";
                
                dayTemplate.exercises.forEach(ex => {
                    const exId = `${ex.id}_w${weekNum}`;
                    const card = document.createElement("div");
                    card.className = "exercise-card";
                    card.innerHTML = `
                        <div class="exercise-header">
                            <div class="exercise-name">
                                <span class="clickable-name">${ex.name}</span>
                                <button class="reset-alt-btn" title="Вернуть оригинал">⟳</button>
                            </div>
                        </div>
                        <div class="target-info">🎯 ${ex.target}</div>
                        <div class="input-row">
                            <div class="input-group">
                                <label>ВЕС (кг)</label>
                                <input type="text" class="input-field" id="${exId}_${ex.weightId}" placeholder="вес">
                            </div>
                            <div class="input-group">
                                <label>ПОДХОДЫ / ПОВТОРЕНИЯ</label>
                                <input type="text" class="input-field" id="${exId}_${ex.repsId}" placeholder="3x5 или 5,5,5">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>КОММЕНТАРИЙ</label>
                            <input type="text" class="comment-input" id="${exId}_${ex.commId}" placeholder="ощущения">
                        </div>
                    `;
                    dayContent.appendChild(card);
                    
                    const clickable = card.querySelector(".clickable-name");
                    clickable.addEventListener("click", (e) => {
                        e.stopPropagation();
                        openModal(ex.id, card, weekNum, dayKey);
                    });
                    card.querySelector(".reset-alt-btn").addEventListener("click", (e) => {
                        e.stopPropagation();
                        resetToOriginal(ex.id, card, weekNum, dayKey);
                    });
                    const savedAlt = localStorage.getItem(`alt_${weekNum}_${dayKey}_${ex.id}`);
                    if(savedAlt && clickable) clickable.innerText = savedAlt;
                });
                
                dayCard.appendChild(dayHeader);
                dayCard.appendChild(dayContent);
                weekContent.appendChild(dayCard);
                
                const checkCircle = dayHeader.querySelector(".check-circle");
                checkCircle.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const w = parseInt(checkCircle.dataset.week);
                    const d = checkCircle.dataset.day;
                    toggleCheckbox(w, d);
                });
                
                const dayToggle = dayHeader.querySelector(".day-toggle");
                const dayCollapsedKey = `day_${weekNum}_${dayKey}_collapsed`;
                if(localStorage.getItem(dayCollapsedKey) === "true") {
                    dayContent.classList.add("collapsed");
                    dayToggle.innerHTML = "▶";
                }
                dayHeader.addEventListener("click", (e) => {
                    if(e.target === checkCircle || checkCircle.contains(e.target)) return;
                    const now = dayContent.classList.toggle("collapsed");
                    localStorage.setItem(dayCollapsedKey, now);
                    dayToggle.innerHTML = now ? "▶" : "▼";
                });
            });
            
            weekBlock.appendChild(weekHeader);
            weekBlock.appendChild(weekContent);
            app.appendChild(weekBlock);
            
            const weekToggle = weekHeader.querySelector(".week-toggle");
            const weekCollapsedKey = `week_${weekNum}_collapsed`;
            if(localStorage.getItem(weekCollapsedKey) === "true") {
                weekContent.classList.add("collapsed");
                weekToggle.innerHTML = "▶";
            }
            weekHeader.addEventListener("click", () => {
                const now = weekContent.classList.toggle("collapsed");
                localStorage.setItem(weekCollapsedKey, now);
                weekToggle.innerHTML = now ? "▶" : "▼";
            });
        }
        
        const journalBlock = document.createElement("div");
        journalBlock.className = "week-block";
        journalBlock.innerHTML = `
            <div class="week-header" style="cursor:default;">
                <div><div class="week-title">📝 ЖУРНАЛ СИЛЫ</div><div class="week-stats">ДВОЙНАЯ ПРОГРЕССИЯ</div></div>
            </div>
            <div class="journal-card">
                <input type="text" class="comment-input" id="bench_note" placeholder="Жим: 70x6 → 72.5x6" style="margin-bottom:12px;">
                <input type="text" class="comment-input" id="pull_note" placeholder="Подтягивания: +7.5 на 8" style="margin-bottom:12px;">
                <input type="text" class="comment-input" id="squat_note" placeholder="Присед: цель 90х3">
            </div>
        `;
        app.appendChild(journalBlock);
        
        renderWeekStats();
        loadAllData();
    }

    function attachAutoSave() {
        document.addEventListener('input', (e) => {
            if(e.target.matches('input, textarea')) saveAllData();
        });
    }

    render();
    loadCheckboxes();
    attachAutoSave();
    window.addEventListener('beforeunload', () => saveAllData());

    document.getElementById("resetCheckboxesBtn").addEventListener("click", resetAllCheckboxes);
    document.getElementById("resetAllDataBtn").addEventListener("click", resetAllFormData);
</script>
</body>
</html>
